<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-title" content="" />
    <link rel="manifest" href="manifest.json" />
    <link href="../dist/styles.css" rel="stylesheet" />
    <script src="../tauri-init.js"></script>
    <script type="module" src="js/dist/elements/save.js"></script>
    <script type="module" src="js/dist/elements/home.js"></script>
    <script type="module" src="js/dist/elements/e2ee-chat-view.js"></script>
    <title>Secure Chat</title>
  </head>
  <body class="min-h-screen font-sans m-0 p-0 overflow-x-hidden">
    <div id="page">
      <div class="flex items-center justify-center h-screen">
        <span class="loading loading-spinner loading-lg"></span>
      </div>
    </div>
    <script type="module">
      const client_id = localStorage.getItem('appClientId'); // set by pick-instance.html on first launch

      let basePath = window.location.pathname;
      if (basePath.endsWith('index.html')) basePath = basePath.slice(0, -'index.html'.length);
      if (!basePath.endsWith('/')) basePath += '/';

      // Fixed redirect URI matching the CIMD document at bonfirenetworks.org/.well-known/client.jsonld
      const redirect_uri = window.__TAURI__ ? "tauri://localhost/" : window.location.origin;

      document.addEventListener("DOMContentLoaded", () => {
        const params = new URLSearchParams(window.location.search);
        const hasCode = params.has("code");
        const hasState = params.has("state");
        const hasToken = !!localStorage.getItem("access_token");
        console.log("Routing:", {
          code: params.get("code"),
          state: params.get("state"),
          access_token: hasToken,
        });
        if (hasCode || hasState) {
          console.log("Rendering <ap-save> for OAuth code exchange");
          document.getElementById("page").innerHTML = `<ap-save
                client-id=${client_id}
                redirect-uri=${redirect_uri}
                success-uri=${redirect_uri}
              />`;
        } else if (!hasToken) {
          console.log("No access_token — redirecting to pick-instance.html");
          window.location.replace('../../pick-instance.html');
        } else {
          console.log("Rendering <ap-home> (already logged in)");
          document.getElementById("page").innerHTML = `<ap-home
                client-id=${client_id}
                redirect-uri=${redirect_uri} />`;
        }
      });
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register(basePath + "js/service-worker.js")
            .catch((err) => console.error("SW registration failed:", err));
        });
      }

  window.secure_chat_modal = true; // global flag to indicate we're in the secure chat modal context
    </script>
  </body>
</html>
