<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-title" content="" />
    <link rel="manifest" href="manifest.json" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.0/cdn/themes/light.css"
    />
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.0/cdn/shoelace.js"
    ></script>
    <style>
      :root {
        --max-width: 75ch;
        --gap: 1rem;
        --sl-font-sans: "Inter", system-ui, sans-serif;
      }
      body {
        font-family: var(--sl-font-sans);
        display: grid;
        grid-template-rows: auto 1fr auto;
        min-height: 100vh;
        margin: 0;
      }
      .spinner-page {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        padding: 1rem;
      }
    </style>
    <script type="module" src="js/elements/login.js"></script>
    <script type="module" src="js/elements/save.js"></script>
    <script type="module" src="js/elements/home.js"></script>
    <script type="module" src="js/e2ee-chat-view.js"></script>
    <title>E2EE AP</title>
  </head>
  <body>
    <div id="page">
      <div class="spinner-page">
        <sl-spinner style="--size: 50vw"></sl-spinner>
      </div>
    </div>
    <script type="module">
                      let client_id = localStorage.getItem('appClientId');

                                let basePath = window.location.pathname;

                                  if (basePath.endsWith('index.html')) {
                                    basePath = basePath.slice(0, -'index.html'.length);
                                  }

                                  if (!basePath.endsWith('/')) basePath += '/';

                                  
                      if (!client_id) {
  
                      client_id = window.location.origin + basePath + 'client.jsonld';

                      localStorage.setItem('appClientId', client_id);
                    }


                      let redirect_uri = window.location.origin + window.location.pathname;

      document.addEventListener("DOMContentLoaded", () => {
        const params = new URLSearchParams(window.location.search);
        const hasCode = params.has("code");
        const hasState = params.has("state");
        const hasToken = !!localStorage.getItem("access_token");
        console.log("Routing:", {
          code: params.get("code"),
          state: params.get("state"),
          access_token: hasToken,
        });
        if (hasCode || hasState) {
          console.log("Rendering <ap-save> for OAuth code exchange");
          document.getElementById("page").innerHTML = `<ap-save
                client-id=${client_id}
                redirect-uri=${redirect_uri}
                success-uri=${redirect_uri}
              />`;
        } else if (!hasToken) {
          console.log("Rendering <ap-login> (no access_token)");
          document.getElementById("page").innerHTML = `<ap-login
                client-id=${client_id}
                redirect-uri=${redirect_uri} />`;
        } else {
          console.log("Rendering <ap-home> (already logged in)");
          document.getElementById("page").innerHTML = `<ap-home
                client-id=${client_id}
                redirect-uri=${redirect_uri} />`;
        }
      });
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register(basePath + "js/service-worker.js")
            .catch((err) => console.error("SW registration failed:", err));
        });
      }

  window.secure_chat_modal = true; // global flag to indicate we're in the secure chat modal context
    </script>
  </body>
</html>
